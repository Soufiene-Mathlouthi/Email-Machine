name: Release

# Push a tag like v0.2.0 (after bumping "version" in package.json) to publish an installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require Gmail sign-in secrets
        shell: bash
        run: |
          [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$TOKEN_PROXY_URL" ] || { echo "::error::Add repo secrets GOOGLE_CLIENT_ID and TOKEN_PROXY_URL"; exit 1; }
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TOKEN_PROXY_URL: ${{ secrets.TOKEN_PROXY_URL }}
      - run: npx electron-vite build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_TOKEN_PROXY_URL: ${{ secrets.TOKEN_PROXY_URL }}
      # Create the release once up front; parallel uploads otherwise each create their own.
      - name: Create release
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
